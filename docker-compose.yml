version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saude_mulher_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: saude_mulher
      DB_USERNAME: saude_mulher
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - saude_mulher

  nginx:
    image: nginx:alpine
    container_name: saude_mulher_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - saude_mulher

  db:
    image: mysql:8.0
    container_name: saude_mulher_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saude_mulher
      MYSQL_USER: saude_mulher
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - saude_mulher

volumes:
  db_data:

networks:
  saude_mulher:
    driver: bridge
